<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    padding: 24px;
  }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff; }
  .card {
    background: #1a1d27;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title { font-size: 13px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .balance {
    font-size: 32px;
    font-weight: 700;
    color: #34d399;
  }
  .balance-unit { font-size: 16px; color: #64748b; margin-left: 4px; }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #94a3b8; }
  .info-value { color: #e2e8f0; font-family: monospace; font-size: 13px; }
  .btn {
    display: inline-block;
    padding: 9px 20px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #4f52d3; }
  .btn-danger {
    background: transparent;
    border: 1px solid rgba(239,68,68,0.4);
    color: #f87171;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .loading { color: #64748b; font-style: italic; }
  .error-msg { color: #f87171; font-size: 13px; margin-top: 8px; }
  .token-row {
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }
  .copy-btn {
    flex-shrink: 0;
    padding: 4px 10px;
    background: rgba(255,255,255,0.06);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<h2>账户信息</h2>

<div class="card" id="balance-card">
  <div class="card-title">余额</div>
  <div class="loading" id="balance-loading">加载中...</div>
  <div id="balance-content" style="display:none">
    <div class="balance" id="balance-value">--</div>
    <div class="error-msg hidden" id="balance-error"></div>
  </div>
</div>

<div class="card" id="info-card">
  <div class="card-title">账户详情</div>
  <div class="loading" id="info-loading">加载中...</div>
  <div id="info-content" style="display:none">
    <div class="info-row">
      <span class="info-label">用户名</span>
      <span class="info-value" id="info-username">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">邮箱</span>
      <span class="info-value" id="info-email">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">API Token</span>
      <div class="token-row">
        <span class="info-value" id="info-token" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">--</span>
        <button class="copy-btn" onclick="copyToken()">复制</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">操作</div>
  <div class="actions">
    <button class="btn" id="recharge-btn" onclick="openRecharge()">充值</button>
    <button class="btn" onclick="loadUserInfo()">刷新</button>
    <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
  </div>
</div>

<script>
  let BASE_URL = '';
  let ACCESS_TOKEN = '';
  let USER_ID = 0;

  async function init() {
    if (window.electronAPI) {
      const info = await window.electronAPI.getAccountInfo();
      BASE_URL = info.baseUrl || '';
      ACCESS_TOKEN = info.accessToken || '';
      USER_ID = info.userId || 0;
    }
    await loadUserInfo();
  }

  async function loadUserInfo() {
    if (!BASE_URL || !ACCESS_TOKEN) {
      document.getElementById('balance-loading').textContent = '未登录';
      document.getElementById('info-loading').textContent = '未登录';
      return;
    }
    document.getElementById('balance-loading').style.display = '';
    document.getElementById('balance-content').style.display = 'none';
    document.getElementById('info-loading').style.display = '';
    document.getElementById('info-content').style.display = 'none';

    try {
      const resp = await fetch(`${BASE_URL}/api/user/self`, {
        headers: {
          'Authorization': `Bearer ${ACCESS_TOKEN}`,
          'New-Api-User': String(USER_ID),
        },
      });
      const data = await resp.json();
      const user = data.data || data;

      document.getElementById('balance-loading').style.display = 'none';
      document.getElementById('balance-content').style.display = '';
      const quota = user.quota;
      const usedQuota = user.used_quota ?? 0;
      if (typeof quota === 'number') {
        // New-API 以 1/500000 USD 为单位存储余额，显示剩余额度
        const dollars = ((quota - usedQuota) / 500000).toFixed(4);
        document.getElementById('balance-value').innerHTML =
          `$${dollars}<span class="balance-unit">USD</span>`;
      } else {
        document.getElementById('balance-value').textContent = '暂无数据';
      }

      document.getElementById('info-loading').style.display = 'none';
      document.getElementById('info-content').style.display = '';
      document.getElementById('info-username').textContent = user.username || '--';
      document.getElementById('info-email').textContent = user.email || '未设置';
      document.getElementById('info-token').textContent = ACCESS_TOKEN;
      document.getElementById('info-token').title = ACCESS_TOKEN;
    } catch (err) {
      document.getElementById('balance-loading').textContent = '加载失败';
      document.getElementById('info-loading').textContent = '加载失败';
    }
  }

  function copyToken() {
    navigator.clipboard.writeText(ACCESS_TOKEN).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '已复制';
      setTimeout(() => btn.textContent = '复制', 1500);
    });
  }

  async function openRecharge() {
    if (!BASE_URL) return;
    const url = `${BASE_URL}/topup`;
    if (window.electronAPI) {
      await window.electronAPI.openExternal(url);
    } else {
      window.open(url, '_blank');
    }
  }

  async function doLogout() {
    if (window.electronAPI) {
      await window.electronAPI.logout();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
