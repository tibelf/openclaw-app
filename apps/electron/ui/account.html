<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f7fa;
    color: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; color: #111827; }
  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .username { font-size: 15px; font-weight: 600; color: #111827; }
  .balance {
    font-size: 26px;
    font-weight: 700;
    color: #16a34a;
  }
  .balance-unit { font-size: 14px; color: #6b7280; margin-left: 3px; }
  .section-title { font-size: 12px; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .log-wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
    min-height: 0;
  }
  .log-scroll {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    color: #9ca3af;
    font-weight: 500;
    text-align: left;
    padding: 0 6px 8px 0;
    border-bottom: 1px solid #f3f4f6;
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #f9fafb; }
  tbody tr:last-child { border-bottom: none; }
  tbody td {
    padding: 7px 6px 7px 0;
    color: #374151;
    vertical-align: middle;
  }
  td.model { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6b7280; font-size: 12px; }
  td.quota { color: #111827; font-weight: 500; text-align: right; }
  .loading { color: #9ca3af; font-style: italic; font-size: 13px; }
  .error-msg { color: #dc2626; font-size: 13px; }
  .actions { display: flex; gap: 10px; }
  .btn {
    display: inline-block;
    padding: 8px 18px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #4f52d3; }
  .btn-danger {
    background: transparent;
    border: 1px solid rgba(239,68,68,0.4);
    color: #dc2626;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.06); }
</style>
</head>
<body>
<h2>账户</h2>

<div class="card">
  <div class="user-row">
    <div>
      <div class="section-title">用户名</div>
      <div class="username" id="info-username"><span class="loading">加载中...</span></div>
    </div>
    <div style="text-align:right">
      <div class="section-title">余额</div>
      <div id="balance-value"><span class="loading">加载中...</span></div>
    </div>
  </div>
</div>

<div class="log-wrap">
  <div class="section-title">消费记录</div>
  <div id="log-loading" class="loading">加载中...</div>
  <div id="log-error" class="error-msg" style="display:none"></div>
  <div class="log-scroll" id="log-scroll" style="display:none">
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>类型</th>
          <th>模型</th>
          <th style="text-align:right">次数</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
</div>

<div class="actions">
  <button class="btn" onclick="openRecharge()">充值</button>
  <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
</div>

<script>
  let BASE_URL = '';
  let ACCESS_TOKEN = '';
  let USER_ID = 0;

  const TYPE_MAP = { 1: '充值', 2: '消费', 3: '管理员充值', 4: '系统调整' };

  function formatTime(ts) {
    const d = new Date(ts * 1000);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function init() {
    if (window.electronAPI) {
      const info = await window.electronAPI.getAccountInfo();
      BASE_URL = info.baseUrl || '';
      ACCESS_TOKEN = info.accessToken || '';
      USER_ID = info.userId || 0;
    }
    if (!BASE_URL || !ACCESS_TOKEN) {
      document.getElementById('info-username').textContent = '未登录';
      document.getElementById('balance-value').textContent = '未登录';
      document.getElementById('log-loading').textContent = '未登录';
      return;
    }
    await Promise.all([loadUserInfo(), loadLogs()]);
  }

  async function loadUserInfo() {
    try {
      const resp = await fetch(`${BASE_URL}/api/user/self`, {
        headers: {
          'Authorization': `Bearer ${ACCESS_TOKEN}`,
          'New-Api-User': String(USER_ID),
        },
      });
      const data = await resp.json();
      const user = data.data || data;
      document.getElementById('info-username').textContent = user.username || '--';
      const quota = user.quota;
      if (typeof quota === 'number') {
        const count = Math.round(quota / 500000);
        document.getElementById('balance-value').innerHTML =
          `<span class="balance">${count}<span class="balance-unit">次</span></span>`;
      } else {
        document.getElementById('balance-value').textContent = '暂无数据';
      }
    } catch {
      document.getElementById('info-username').textContent = '加载失败';
      document.getElementById('balance-value').textContent = '加载失败';
    }
  }

  async function loadLogs() {
    try {
      const resp = await fetch(`${BASE_URL}/api/log?p=1&page_size=50`, {
        headers: {
          'Authorization': `Bearer ${ACCESS_TOKEN}`,
          'New-Api-User': String(USER_ID),
        },
      });
      const data = await resp.json();
      const items = data.data?.items ?? data.data ?? [];
      document.getElementById('log-loading').style.display = 'none';
      if (!items.length) {
        document.getElementById('log-scroll').style.display = '';
        document.getElementById('log-body').innerHTML =
          '<tr><td colspan="4" style="color:#9ca3af;text-align:center;padding:20px 0">暂无消费记录</td></tr>';
        return;
      }
      const rows = items.map(item => {
        const time = item.created_at ? formatTime(item.created_at) : '--';
        const type = TYPE_MAP[item.type] || `类型${item.type ?? ''}`;
        const model = item.model_name || '--';
        const quota = item.quota != null ? Math.round(item.quota / 500000) : '--';
        return `<tr>
          <td>${time}</td>
          <td>${type}</td>
          <td class="model" title="${model}">${model}</td>
          <td class="quota">${quota}</td>
        </tr>`;
      }).join('');
      document.getElementById('log-body').innerHTML = rows;
      document.getElementById('log-scroll').style.display = '';
    } catch {
      document.getElementById('log-loading').style.display = 'none';
      const errEl = document.getElementById('log-error');
      errEl.textContent = '消费记录加载失败';
      errEl.style.display = '';
    }
  }

  async function openRecharge() {
    if (!BASE_URL) return;
    const url = `${BASE_URL}/topup`;
    if (window.electronAPI) {
      await window.electronAPI.openExternal(url);
    } else {
      window.open(url, '_blank');
    }
  }

  async function doLogout() {
    if (window.electronAPI) {
      await window.electronAPI.logout();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
